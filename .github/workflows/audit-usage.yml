name: Audit Usage Massal Klien

on:
  repository_dispatch:
    types: [trigger-usage-audit]
  workflow_dispatch:

jobs:
  audit-usage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Initialize Package JSON & Install Dependencies
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm pkg set type="module"
          npm install node-fetch@3

      - name: Run Usage Audit Script
        env:
          PUSAT_API_URL: ${{ secrets.PUSAT_API_URL }}
          MASS_UPDATE_PASSWORD: ${{ secrets.MASS_UPDATE_PASSWORD }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node scripts/audit-usage.js