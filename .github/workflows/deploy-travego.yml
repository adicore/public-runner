name: Deploy Worker Utama Pribadi, Sync Build ke Dashboard Pusat, & Deploy Massal ke Seluruh Worker Klien

on:
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-travego]

concurrency:
  group: deploy-travego-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-all:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Private Repository (dashboard_travego)
        uses: actions/checkout@v4
        with:
          repository: adicore/dashboard_travego
          token: ${{ secrets.SYNC_PAT }}
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Deploy Worker Utama Travego
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Build Worker Code (dist/worker-bundled.js)
        run: npm run build

      - name: Push Compiled Worker Code ke Repo dashboard-pusat
        env:
          GH_PAT: ${{ secrets.SYNC_PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          GH_OWNER: ${{ secrets.GH_OWNER || 'adicore' }}
        run: |
          echo "🔄 Menyimpan hasil build ke repo dashboard-pusat..."
          git clone https://${GH_PAT}@github.com/${GH_OWNER}/dashboard-pusat.git temp-pusat
          mkdir -p temp-pusat/src
          cp dist/worker-bundled.js temp-pusat/src/client-worker-bundled.js
          cd temp-pusat
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/client-worker-bundled.js
          git diff-index --quiet HEAD || git commit -m "chore: auto-sync latest compiled client worker binary [skip ci]"
          git push origin main
          echo "✅ Hasil build berhasil disimpan ke repo dashboard-pusat!"

      - name: Eksekusi Deploy Massal ke Seluruh Worker Klien
        env:
          PUSAT_API_URL: "https://dashboard-admin-pusat.accessed.workers.dev"
          MASS_UPDATE_PASSWORD: ${{ secrets.MASS_UPDATE_PASSWORD }}
        run: node scripts/mass-deploy-clients.js