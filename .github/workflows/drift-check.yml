name: Daily Drift Check & Auto Sync

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [drift-check]

concurrency:
  group: drift-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Private Repository
        uses: actions/checkout@v4
        with:
          repository: adicore/dashboard-pusat
          token: ${{ secrets.SYNC_PAT }}
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund --prefer-offline

      - name: Run Drift Check and Sync Engine
        run: node scripts/drift-check.js
        env:
          MASS_UPDATE_PASSWORD: ${{ secrets.MASS_UPDATE_PASSWORD }}
          GITHUB_PAT: ${{ secrets.SYNC_PAT }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PUSAT_WORKER_URL: 'https://dashboard-admin-pusat.accessed.workers.dev'