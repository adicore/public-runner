name: Obfuscate & Deploy CMS Assets

on:
  repository_dispatch:
    types: [trigger-cms-build]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Private Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.MAIN_REPO_OWNER }}/${{ secrets.MAIN_REPO_NAME }}
          token: ${{ secrets.SYNC_PAT }}
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Auto-Inject Security Guard & Obfuscate All JS
        run: |
          npm install -g javascript-obfuscator
          mkdir -p dist/js dist/css
          
          # 1. Salin seluruh isi assets/js termasuk subfolder (modules/) ke dist/js
          cp -r assets/js/* dist/js/

          # 2. Inject security-guard.js ke seluruh file .js (termasuk yang ada di dalam subfolder)
          find dist/js -type f -name "*.js" | while read -r file; do
            tmpfile=$(mktemp)
            cat assets/security-guard.js "$file" > "$tmpfile"
            mv "$tmpfile" "$file"
          done

          # 3. Obfuscate seluruh file JS secara rekursif di dalam folder dist/js
          javascript-obfuscator dist/js --output dist/js --config obfuscator.json
          
          # 4. Salin seluruh file CSS
          cp -r assets/css/* dist/css/

      - name: Deploy to Cloudflare Pages via Wrangler
        run: npx wrangler pages deploy dist --project-name=static-files-cms
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}