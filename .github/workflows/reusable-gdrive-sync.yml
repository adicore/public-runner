name: Reusable Sync Repo to Google Drive

on:
  workflow_call:
    secrets:
      GDRIVE_TOKEN_JSON:
        required: true

jobs:
  sync-to-gdrive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kode Repository
        uses: actions/checkout@v4

      - name: Install Rclone
        run: |
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q rclone-current-linux-amd64.zip
          sudo cp rclone-*-linux-amd64/rclone /usr/local/bin/
          sudo chmod +x /usr/local/bin/rclone

      - name: Sync ke Google Drive
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN_JSON }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          rclone sync ./ "gdrive:Dashboard_System/${REPO_NAME}" \
            --exclude ".git/**" \
            --exclude ".github/**" \
            --exclude "node_modules/**" \
            --exclude ".wrangler/**" \
            --transfers 8 \
            --verbose